<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Marsol</title>
<link rel="preload" as="image" href="img/splash/1.jpg">
<link rel="preload" as="image" href="img/splash/2.jpg">
<script>
/* Recargar (y repetir el splash) cada vez que se vuelve a la página:
   - restaurada desde caché atrás/adelante (bfcache, típico en iPhone/Safari)
   - al volver a la pestaña o a la app tras haberla dejado */
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
let pageWasHidden = false;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') pageWasHidden = true;
  else if (pageWasHidden) location.reload();
});
</script>

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{
  background:#0f172a;
  color:white;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* ================= SPLASH ================= */

.splash-screen{
  position:fixed;
  inset:0;
  background:#020617;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  z-index:1000;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  perspective:1200px;
  transition:opacity .45s ease, visibility .45s ease;
}

.splash-screen.fade-out{
  opacity:0;
  visibility:hidden;
}

.s-grid,.s-glow,.s-ring,.tunnel{position:absolute;pointer-events:none}
.s-grid{
  inset:0;
  background-image:radial-gradient(#1e1b4b 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 60%,transparent 100%);
  mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 60%,transparent 100%);
  opacity:.65;
}
.s-glow{inset:0;background:radial-gradient(circle at center,rgba(99,102,241,.2) 0%,transparent 75%)}
.s-ring{border-radius:50%}
.s-ring.r1{width:48vmin;height:48vmin;border:1px solid rgba(129,140,248,.12)}
.s-ring.r2{width:76vmin;height:76vmin;border:1px dashed rgba(255,255,255,.1)}

.tunnel{inset:0;transform-style:preserve-3d}

.t-card{
  position:absolute;
  left:50%;
  top:50%;
  aspect-ratio:4/5;
  border-radius:16px;
  overflow:hidden;
  background:linear-gradient(135deg,#1e3a8a,#0f172a);
  box-shadow:0 25px 50px -12px rgba(0,0,0,.9);
  outline:1px solid rgba(255,255,255,.15);
  opacity:0;
  will-change:transform,opacity;
}
.t-card img{width:100%;height:100%;object-fit:cover;display:block}
.t-card span{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:14px;
  background:linear-gradient(to top,rgba(0,0,0,.45),transparent 45%);
  font:500 .72rem ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(255,255,255,.95);
}

.splash-center{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:0 24px;
  pointer-events:none;
  z-index:2;
  filter:drop-shadow(0 4px 24px rgba(2,6,23,.9));
  will-change:transform,opacity;
}
.splash-eyebrow{
  font:500 .72rem ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.4em;
  text-transform:uppercase;
  color:#818cf8;
  margin-bottom:1rem;
}
.splash-title{
  font-size:clamp(3rem,13vw,6rem);
  font-weight:700;
  letter-spacing:-.04em;
  line-height:.9;
  background:linear-gradient(to bottom,#fff,#fff 45%,rgba(255,255,255,.4));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.splash-subtitle{
  margin-top:1rem;
  font-size:.95rem;
  font-weight:300;
  letter-spacing:2px;
  color:#94a3b8;
}
.splash-skip{
  position:absolute;
  bottom:32px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  font:500 .68rem ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:#94a3b8;
  pointer-events:none;
}
.splash-skip i{width:1px;height:24px;background:linear-gradient(#6366f1,transparent)}

/* ================= MAIN ================= */

.main-content{
  text-align:center;
  opacity:0;
  transition:opacity .6s ease;
}

.main-content.visible{
  opacity:1;
}

.main-content h2{
  font-weight:400;
  margin-bottom:2.5rem;
  color:#cbd5e1;
  letter-spacing:1px;
}

/* ================= PERFILES ================= */

.perfiles{
  display:flex;
  gap:25px;
  flex-wrap:wrap;
  justify-content:center;
}

.perfil-card{
  width:190px;
  height:120px;
  border-radius:20px;
  background:linear-gradient(135deg,#1e293b,#0f172a);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:1.1rem;
  font-weight:500;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(15,23,42,.25);
  transition:background .2s ease, box-shadow .2s ease;
}

.perfil-card:hover{
  background:linear-gradient(135deg,#1f2937,#111827);
  box-shadow:0 12px 30px rgba(15,23,42,.35);
}

.familia{
  background:linear-gradient(135deg,#1e3a8a,#1e293b);
}

.familia:hover{
  background:linear-gradient(135deg,#1d4ed8,#1e293b);
}

/* ================= APPLE WALLET TRANSITION ================= */

.wallet-transition{
  position:fixed;
  left:0;
  bottom:-100%;
  width:100%;
  height:100%;
  background:#020617;
  z-index:2000;
  transition:bottom .6s cubic-bezier(.4,.0,.2,1);
}

.wallet-transition.active{
  bottom:0;
}

.fade-out-content{
  opacity:0;
  transition:opacity .3s ease;
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="splash-screen" aria-label="App Marsol">
  <div class="s-grid"></div>
  <div class="s-glow"></div>
  <div class="s-ring r1"></div>
  <div class="s-ring r2"></div>
  <div id="splashCenter" class="splash-center">
    <div class="splash-eyebrow">Control de gastos</div>
    <div class="splash-title">App<br>Marsol</div>
    <div class="splash-subtitle">Hecho con amor 💞</div>
  </div>
  <div id="tunnel" class="tunnel" aria-hidden="true"></div>
  <div id="splashSkip" class="splash-skip"><span>Toca para entrar</span><i></i></div>
</div>

<!-- MAIN -->
<div id="mainContent" class="main-content">
  <h2>Selecciona tu perfil</h2>

  <div class="perfiles">
    <div class="perfil-card" onclick="seleccionarPerfil('Maria')">
      Maria
    </div>

    <div class="perfil-card" onclick="seleccionarPerfil('Andres')">
      Andres
    </div>
  </div>
</div>

<!-- CAPA TRANSICIÓN -->
<div id="walletTransition" class="wallet-transition"></div>

<script>

/* SPLASH: túnel en perspectiva (vuelo automático; rueda/swipe acelera, toque salta) */
document.addEventListener('DOMContentLoaded', function(){
  const splash = document.getElementById('splash');
  const main = document.getElementById('mainContent');
  const tunnel = document.getElementById('tunnel');
  const center = document.getElementById('splashCenter');
  const skip = document.getElementById('splashSkip');

  // fotos propias (img/splash/1-5.jpg), dos pasadas para llenar el túnel
  const IMAGES = [1,2,3,4,5,3,1,5,2,4].map(n => `img/splash/${n}.jpg`);
  const N = IMAGES.length, SPAN = .55, DURATION = 2600;
  const clamp = v => Math.min(1, Math.max(0, v));
  const lerp = (v, a, b) => a + (b - a) * v;
  // interpolación por tramos (equivalente a useTransform)
  const ramp = (v, xs, ys) => {
    if (v <= xs[0]) return ys[0];
    for (let i = 1; i < xs.length; i++)
      if (v <= xs[i]) return lerp((v - xs[i-1]) / (xs[i] - xs[i-1]), ys[i-1], ys[i]);
    return ys[ys.length - 1];
  };

  const cards = IMAGES.map((src, i) => {
    const a = i * 137.5 * Math.PI / 180;
    const el = document.createElement('div');
    el.className = 't-card';
    el.style.zIndex = i + 1;
    el.innerHTML = `<img src="${src}" alt="" draggable="false" decoding="async"><span></span>`;
    el.querySelector('img').onerror = function(){ this.remove(); };
    tunnel.appendChild(el);
    return {
      el, cos: Math.cos(a), sin: Math.sin(a),
      rx: .28 + (i % 3) * .08, ry: .26 + (i % 2) * .09,
      rot: (i % 2 ? -1 : 1) * (3 + (i % 5) * 2),
      start: i / N * (1 - SPAN)
    };
  });

  let W, H, mobile;
  const resize = () => {
    W = innerWidth; H = innerHeight; mobile = W < 768;
    splash.style.perspective = mobile ? '900px' : '1200px';
    const cw = mobile ? Math.max(130, Math.min(180, W * .38)) : Math.max(180, Math.min(270, W * .18));
    cards.forEach(c => c.el.style.width = cw + 'px');
  };
  resize();
  addEventListener('resize', resize);

  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    splash.classList.add('fade-out');
    main.classList.add('visible');
    setTimeout(() => splash.remove(), 500);
  };
  splash.addEventListener('click', finish);

  // entrada del usuario: rueda / swipe suman progreso, puntero = parallax
  let raw = 0, prog = 0, px = 0, py = 0, tx = 0, ty = 0, last = performance.now();
  // movimiento reducido: túnel congelado a mitad de recorrido y salida automática
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) { raw = prog = .4; setTimeout(finish, 1800); }
  splash.addEventListener('wheel', e => { e.preventDefault(); if (!reduced) raw = clamp(raw + e.deltaY * .0008); }, {passive:false});
  let touchY = null;
  splash.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, {passive:true});
  splash.addEventListener('touchmove', e => {
    const y = e.touches[0].clientY;
    if (touchY !== null) raw = clamp(raw + (touchY - y) * .002);
    touchY = y;
  }, {passive:true});
  addEventListener('pointermove', e => { tx = (e.clientX / W - .5) * 2; ty = (e.clientY / H - .5) * 2; }, {passive:true});

  const frame = now => {
    if (done) return;
    const dt = Math.min(64, now - last); last = now;
    if (!reduced) raw = clamp(raw + dt / DURATION);
    const k = reduced ? 0 : 1 - Math.exp(-dt / 160);   // suavizado tipo spring
    prog += (raw - prog) * k;
    px += (tx - px) * k * .6; py += (ty - py) * k * .6;

    const far = mobile ? -1200 : -1700, near = mobile ? 350 : 500, pan = mobile ? 20 : 45;
    for (const c of cards) {
      const l = clamp((prog - c.start) / SPAN);
      const x = c.cos * W * c.rx - px * pan, y = c.sin * H * c.ry - py * pan;
      c.el.style.transform = `translate3d(calc(-50% + ${x}px), calc(-50% + ${y}px), ${lerp(l, far, near)}px) rotateZ(${c.rot}deg)`;
      c.el.style.opacity = ramp(l, [0,.18,.82,.98], [0,1,1,0]);
    }
    center.style.transform = `scale(${ramp(prog, [0,.5,1], [.7,1,1.35])})`;
    center.style.opacity = ramp(prog, [0,.12,.85,1], [.25,1,1,0]);
    skip.style.opacity = ramp(prog, [0,.12], [1,0]);

    if (prog > .97) return finish();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
});

/* TRANSICIÓN TIPO APPLE WALLET */
function seleccionarPerfil(nombre){
  sessionStorage.setItem('perfil', nombre);

  const transition = document.getElementById('walletTransition');
  const content = document.getElementById('mainContent');

  content.classList.add('fade-out-content');

  setTimeout(()=>{
    transition.classList.add('active');
  },100);

  setTimeout(()=>{
    if(nombre === 'Familia'){
      window.location.href = 'resumen.html';
    } else {
      window.location.href = 'app.html';
    }
  },650);
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Marsol</title>
<link rel="preload" as="image" href="img/splash/1.jpg">
<link rel="preload" as="image" href="img/splash/2.jpg">
<script>
/* Recargar (y repetir el splash) cada vez que se vuelve a la página:
   - restaurada desde caché atrás/adelante (bfcache, típico en iPhone/Safari)
   - al volver a la pestaña o a la app tras haberla dejado */
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
let pageWasHidden = false;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') pageWasHidden = true;
  else if (pageWasHidden) location.reload();
});
</script>

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

body{
  background:#0f172a;
  color:white;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* ================= SPLASH ================= */

.splash-screen{
  position:fixed;
  inset:0;
  background:#020617;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  z-index:1000;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  perspective:1200px;
  transition:opacity .45s ease, visibility .45s ease;
}

.splash-screen.fade-out{
  opacity:0;
  visibility:hidden;
}

.s-grid,.s-glow,.s-ring,.tunnel{position:absolute;pointer-events:none}
.s-grid{
  inset:0;
  background-image:radial-gradient(#1e1b4b 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 60%,transparent 100%);
  mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 60%,transparent 100%);
  opacity:.65;
}
.s-glow{inset:0;background:radial-gradient(circle at center,rgba(99,102,241,.2) 0%,transparent 75%)}
.s-ring{border-radius:50%}
.s-ring.r1{width:48vmin;height:48vmin;border:1px solid rgba(129,140,248,.12)}
.s-ring.r2{width:76vmin;height:76vmin;border:1px dashed rgba(255,255,255,.1)}

.tunnel{inset:0;transform-style:preserve-3d}

.t-card{
  position:absolute;
  left:50%;
  top:50%;
  aspect-ratio:4/5;
  border-radius:16px;
  overflow:hidden;
  background:linear-gradient(135deg,#1e3a8a,#0f172a);
  box-shadow:0 25px 50px -12px rgba(0,0,0,.9);
  outline:1px solid rgba(255,255,255,.15);
  opacity:0;
  will-change:transform,opacity;
}
.t-card img{width:100%;height:100%;object-fit:cover;display:block}
.t-card span{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  padding:14px;
  background:linear-gradient(to top,rgba(0,0,0,.45),transparent 45%);
  font:500 .72rem ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:rgba(255,255,255,.95);
}

.splash-center{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:0 24px;
  pointer-events:none;
  z-index:2;
  filter:drop-shadow(0 4px 24px rgba(2,6,23,.9));
  will-change:transform,opacity;
}
.splash-eyebrow{
  font:500 .72rem ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.4em;
  text-transform:uppercase;
  color:#818cf8;
  margin-bottom:1rem;
}
.splash-title{
  font-size:clamp(3rem,13vw,6rem);
  font-weight:700;
  letter-spacing:-.04em;
  line-height:.9;
  background:linear-gradient(to bottom,#fff,#fff 45%,rgba(255,255,255,.4));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.splash-subtitle{
  margin-top:1rem;
  font-size:.95rem;
  font-weight:300;
  letter-spacing:2px;
  color:#94a3b8;
}
.splash-skip{
  position:absolute;
  bottom:32px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  font:500 .68rem ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:#94a3b8;
  pointer-events:none;
}
.splash-skip i{width:1px;height:24px;background:linear-gradient(#6366f1,transparent)}

/* ================= MAIN ================= */

.main-content{
  text-align:center;
  opacity:0;
  transition:opacity .6s ease;
}

.main-content.visible{
  opacity:1;
}

.main-content h2{
  font-weight:400;
  margin-bottom:2.5rem;
  color:#cbd5e1;
  letter-spacing:1px;
}

/* ================= PERFILES ================= */

.perfiles{
  display:flex;
  gap:25px;
  flex-wrap:wrap;
  justify-content:center;
}

.perfil-card{
  width:190px;
  height:120px;
  border-radius:20px;
  background:linear-gradient(135deg,#1e293b,#0f172a);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:1.1rem;
  font-weight:500;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(15,23,42,.25);
  transition:background .2s ease, box-shadow .2s ease;
}

.perfil-card:hover{
  background:linear-gradient(135deg,#1f2937,#111827);
  box-shadow:0 12px 30px rgba(15,23,42,.35);
}

.familia{
  background:linear-gradient(135deg,#1e3a8a,#1e293b);
}

.familia:hover{
  background:linear-gradient(135deg,#1d4ed8,#1e293b);
}

/* ================= APPLE WALLET TRANSITION ================= */

.wallet-transition{
  position:fixed;
  left:0;
  bottom:-100%;
  width:100%;
  height:100%;
  background:#020617;
  z-index:2000;
  transition:bottom .6s cubic-bezier(.4,.0,.2,1);
}

.wallet-transition.active{
  bottom:0;
}

.fade-out-content{
  opacity:0;
  transition:opacity .3s ease;
}


/* ================= HERO CON TARJETAS ================= */
.main-content.hero{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;text-align:center;
  background:radial-gradient(120% 70% at 50% 0%,#1b2440 0%,#0b1020 55%,#070a14 100%)}
.hero-nav{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #ffffff14}
.hero-logo{display:flex;align-items:center;gap:8px;font-size:1.05rem}
.hero-logo .ms{width:30px;height:30px}
.hero-tag{font-size:.72rem;color:#94a3b8;letter-spacing:.14em;text-transform:uppercase}
.hero-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 16px}
.hero-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0 8px}
.hero h1{font-size:clamp(2.4rem,11vw,4.2rem);line-height:1.06;font-weight:700;letter-spacing:-.025em;color:#f8fafc;max-width:15ch}
.hero h1 em{font-style:italic;background:linear-gradient(90deg,#7dd3fc,#c4b5fd,#f9a8d4,#fdba74,#7dd3fc);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;padding-right:.1em;animation:tonos 6s linear infinite}
@keyframes tonos{to{background-position:300% 0}}
.hero p{margin-top:14px;color:#94a3b8;max-width:30ch;line-height:1.5;font-size:1rem}
.hero-btns{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap;justify-content:center}
.orb-btn{display:flex;align-items:center;gap:10px;padding:8px 22px 8px 8px;border-radius:999px;border:1px solid #ffffff26;cursor:pointer;
  background:linear-gradient(180deg,#1e293b,#0f172a);color:#fff;font-size:1rem;font-weight:600;-webkit-tap-highlight-color:transparent;
  box-shadow:0 8px 24px #0007,inset 0 1px 0 #ffffff1f;transition:transform .2s,box-shadow .25s}
.orb-btn .ms{width:38px;height:38px;flex:none;filter:drop-shadow(0 3px 8px #0ea5e966);transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.orb-btn:hover{transform:translateY(-2px);box-shadow:0 0 26px #7dd3fc40,0 8px 24px #0007,inset 0 1px 0 #ffffff1f}
.orb-btn:hover .ms{transform:scale(1.12)}
.orb-btn:active{transform:scale(.96)}
.fan{position:relative;flex:none;width:100%;--w:clamp(130px,min(44vw,30vh),230px);--paso:clamp(62px,19vw,125px);height:calc(var(--w) * 1.4667 - 36px)}
.fan .card{position:absolute;bottom:-36px;left:50%;width:var(--w);aspect-ratio:3/4.4;margin-left:calc(var(--w) / -2);border-radius:18px;overflow:hidden;
  box-shadow:0 18px 40px #000a;outline:2px solid #ffffff2e;transform-origin:50% 100%;opacity:0;
  transform:translateX(calc(var(--i) * var(--paso))) translateY(70px) rotate(var(--r))}
.fan .card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.main-content.visible .fan .card{animation:sube .65s cubic-bezier(.22,1,.36,1) var(--d) forwards}
@keyframes sube{to{opacity:1;transform:translateX(calc(var(--i) * var(--paso))) translateY(0) rotate(var(--r))}}
.a1,.a2,.a3{opacity:0;transform:translateY(20px)}
.main-content.visible .a1{animation:entra .6s ease-out .2s forwards}
.main-content.visible .a2{animation:entra .5s ease-out .38s forwards}
.main-content.visible .a3{animation:entra .4s ease-out .52s forwards}
@keyframes entra{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.a1,.a2,.a3,.fan .card{animation-duration:.01s!important}}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="splash-screen" aria-label="App Marsol">
  <div class="s-grid"></div>
  <div class="s-glow"></div>
  <div class="s-ring r1"></div>
  <div class="s-ring r2"></div>
  <div id="splashCenter" class="splash-center">
    <div class="splash-eyebrow">Control de gastos</div>
    <div class="splash-title">App<br>Marsol</div>
    <div class="splash-subtitle">Hecho con amor 💞</div>
  </div>
  <div id="tunnel" class="tunnel" aria-hidden="true"></div>
  <div id="splashSkip" class="splash-skip"><span>Toca para entrar</span><i></i></div>
</div>

<!-- Ícono Marsol (mar + sol): cielo al atardecer, sol en el horizonte y olas animadas -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ms-cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset=".42" stop-color="#6d28d9"/><stop offset=".58" stop-color="#ec4899"/><stop offset=".68" stop-color="#fdba74"/></linearGradient>
    <radialGradient id="ms-sol"><stop offset="0" stop-color="#fffbeb"/><stop offset=".5" stop-color="#fde68a"/><stop offset="1" stop-color="#fb923c"/></radialGradient>
    <linearGradient id="ms-mar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset=".55" stop-color="#0369a1"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="ms-ola" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a5f3fc"/><stop offset=".4" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490" stop-opacity=".2"/></linearGradient>
    <radialGradient id="ms-brillo" cx=".32" cy=".22" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="ms-c"><circle cx="32" cy="32" r="30"/></clipPath>
    <symbol id="marsol" viewBox="0 0 64 64">
      <g clip-path="url(#ms-c)">
        <rect width="64" height="64" fill="url(#ms-cielo)"/>
        <circle cx="32" cy="39" r="12" fill="url(#ms-sol)"><animate attributeName="r" values="11.5;12.5;11.5" dur="5s" repeatCount="indefinite"/></circle>
        <path d="M-32 39q8-3 16 0t16 0t16 0t16 0t16 0t16 0t16 0t16 0V64H-32Z" fill="url(#ms-mar)"><animateTransform attributeName="transform" type="translate" from="0 0" to="32 0" dur="5s" repeatCount="indefinite"/></path>
        <path d="M-32 46q8 3 16 0t16 0t16 0t16 0t16 0t16 0t16 0t16 0V64H-32Z" fill="url(#ms-ola)" opacity=".85"><animateTransform attributeName="transform" type="translate" from="0 0" to="-32 0" dur="3.6s" repeatCount="indefinite"/></path>
        <path d="M25 42.5h5M34 42.5h4M29 48h6" stroke="#fff7ed" stroke-width=".7" stroke-linecap="round" opacity=".5"><animate attributeName="opacity" values=".15;.6;.15" dur="2.8s" repeatCount="indefinite"/></path>
      </g>
      <circle cx="32" cy="32" r="30" fill="url(#ms-brillo)"/>
      <circle cx="32" cy="32" r="30.3" fill="none" stroke="#ffffff66" stroke-width="1.2"/>
    </symbol>
  </defs>
</svg>
<!-- MAIN: hero con tarjetas en abanico -->
<div id="mainContent" class="main-content hero">
  <nav class="hero-nav">
    <div class="hero-logo"><svg class="ms"><use href="#marsol"/></svg><b>App Marsol</b></div>
    <span class="hero-tag">Control de gastos</span>
  </nav>
  <div class="hero-body">
    <div class="hero-top">
    <h1 class="a1">Dime <em>quién eres</em></h1>
    <div class="hero-btns a3">
      <button class="orb-btn" onclick="seleccionarPerfil('Maria')"><svg class="ms"><use href="#marsol"/></svg><span>Soy María</span></button>
      <button class="orb-btn" onclick="seleccionarPerfil('Andres')"><svg class="ms"><use href="#marsol"/></svg><span>Soy Andrés</span></button>
    </div>
    </div>
    <div class="fan" aria-hidden="true">
      <div class="card" style="--i:-2;--r:-22deg;--d:0.9s;z-index:10"><img src="img/splash/2.jpg" alt="" draggable="false"></div>
      <div class="card" style="--i:-1;--r:-11deg;--d:0.75s;z-index:20"><img src="img/splash/4.jpg" alt="" draggable="false"></div>
      <div class="card" style="--i:0;--r:0deg;--d:0.6s;z-index:30"><img src="img/splash/1.jpg" alt="" draggable="false"></div>
      <div class="card" style="--i:1;--r:11deg;--d:0.75s;z-index:20"><img src="img/splash/3.jpg" alt="" draggable="false"></div>
      <div class="card" style="--i:2;--r:22deg;--d:0.9s;z-index:10"><img src="img/splash/5.jpg" alt="" draggable="false"></div>
    </div>
  </div>
</div>

<!-- CAPA TRANSICIÓN -->
<div id="walletTransition" class="wallet-transition"></div>

<script>

/* SPLASH: túnel en perspectiva (vuelo automático; rueda/swipe acelera, toque salta) */
document.addEventListener('DOMContentLoaded', function(){
  const splash = document.getElementById('splash');
  const main = document.getElementById('mainContent');
  const tunnel = document.getElementById('tunnel');
  const center = document.getElementById('splashCenter');
  const skip = document.getElementById('splashSkip');

  // fotos propias (img/splash/1-5.jpg), dos pasadas para llenar el túnel
  const IMAGES = [1,2,3,4,5,3,1,5,2,4].map(n => `img/splash/${n}.jpg`);
  const N = IMAGES.length, SPAN = .55, DURATION = 2600;
  const clamp = v => Math.min(1, Math.max(0, v));
  const lerp = (v, a, b) => a + (b - a) * v;
  // interpolación por tramos (equivalente a useTransform)
  const ramp = (v, xs, ys) => {
    if (v <= xs[0]) return ys[0];
    for (let i = 1; i < xs.length; i++)
      if (v <= xs[i]) return lerp((v - xs[i-1]) / (xs[i] - xs[i-1]), ys[i-1], ys[i]);
    return ys[ys.length - 1];
  };

  const cards = IMAGES.map((src, i) => {
    const a = i * 137.5 * Math.PI / 180;
    const el = document.createElement('div');
    el.className = 't-card';
    el.style.zIndex = i + 1;
    el.innerHTML = `<img src="${src}" alt="" draggable="false" decoding="async"><span></span>`;
    el.querySelector('img').onerror = function(){ this.remove(); };
    tunnel.appendChild(el);
    return {
      el, cos: Math.cos(a), sin: Math.sin(a),
      rx: .28 + (i % 3) * .08, ry: .26 + (i % 2) * .09,
      rot: (i % 2 ? -1 : 1) * (3 + (i % 5) * 2),
      start: i / N * (1 - SPAN)
    };
  });

  let W, H, mobile;
  const resize = () => {
    W = innerWidth; H = innerHeight; mobile = W < 768;
    splash.style.perspective = mobile ? '900px' : '1200px';
    const cw = mobile ? Math.max(130, Math.min(180, W * .38)) : Math.max(180, Math.min(270, W * .18));
    cards.forEach(c => c.el.style.width = cw + 'px');
  };
  resize();
  addEventListener('resize', resize);

  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    splash.classList.add('fade-out');
    main.classList.add('visible');
    setTimeout(() => splash.remove(), 500);
  };
  splash.addEventListener('click', finish);

  // entrada del usuario: rueda / swipe suman progreso, puntero = parallax
  let raw = 0, prog = 0, px = 0, py = 0, tx = 0, ty = 0, last = performance.now();
  // movimiento reducido: túnel congelado a mitad de recorrido y salida automática
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) { raw = prog = .4; setTimeout(finish, 1800); }
  splash.addEventListener('wheel', e => { e.preventDefault(); if (!reduced) raw = clamp(raw + e.deltaY * .0008); }, {passive:false});
  let touchY = null;
  splash.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, {passive:true});
  splash.addEventListener('touchmove', e => {
    const y = e.touches[0].clientY;
    if (touchY !== null) raw = clamp(raw + (touchY - y) * .002);
    touchY = y;
  }, {passive:true});
  addEventListener('pointermove', e => { tx = (e.clientX / W - .5) * 2; ty = (e.clientY / H - .5) * 2; }, {passive:true});

  const frame = now => {
    if (done) return;
    const dt = Math.min(64, now - last); last = now;
    if (!reduced) raw = clamp(raw + dt / DURATION);
    const k = reduced ? 0 : 1 - Math.exp(-dt / 160);   // suavizado tipo spring
    prog += (raw - prog) * k;
    px += (tx - px) * k * .6; py += (ty - py) * k * .6;

    const far = mobile ? -1200 : -1700, near = mobile ? 350 : 500, pan = mobile ? 20 : 45;
    for (const c of cards) {
      const l = clamp((prog - c.start) / SPAN);
      const x = c.cos * W * c.rx - px * pan, y = c.sin * H * c.ry - py * pan;
      c.el.style.transform = `translate3d(calc(-50% + ${x}px), calc(-50% + ${y}px), ${lerp(l, far, near)}px) rotateZ(${c.rot}deg)`;
      c.el.style.opacity = ramp(l, [0,.18,.82,.98], [0,1,1,0]);
    }
    center.style.transform = `scale(${ramp(prog, [0,.5,1], [.7,1,1.35])})`;
    center.style.opacity = ramp(prog, [0,.12,.85,1], [.25,1,1,0]);
    skip.style.opacity = ramp(prog, [0,.12], [1,0]);

    if (prog > .97) return finish();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
});

/* TRANSICIÓN TIPO APPLE WALLET */
function seleccionarPerfil(nombre){
  sessionStorage.setItem('perfil', nombre);

  const transition = document.getElementById('walletTransition');
  const content = document.getElementById('mainContent');

  content.classList.add('fade-out-content');

  setTimeout(()=>{
    transition.classList.add('active');
  },100);

  setTimeout(()=>{
    if(nombre === 'Familia'){
      window.location.href = 'resumen.html';
    } else {
      window.location.href = 'app.html';
    }
  },650);
}

</script>

</body>
</html>
